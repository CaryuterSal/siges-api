<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/base :: layout('Reserva Cancelada - SIGES', ~{::div})}">

<body>
    <div>
        <div class="badge">Cancelación</div>
        <div class="greeting">¡Hola!</div>
        <p class="text">
            Confirmamos que tu reserva ha sido cancelada.
        </p>

        <div class="credential-box">
            <div class="credential-row">
                <div class="credential-label">FOLIO</div>
                <div class="credential-value" th:text="'#' + ${reservationId}">#12345</div>
            </div>
            <div class="credential-row">
                <div class="credential-label">ESTADO</div>
                <div class="credential-value" style="color: #ed6c02;">Cancelada</div>
            </div>
        </div>

        <p class="text">
            El espacio ha sido liberado para otros usuarios. Si fue un error, por favor realiza una nueva solicitud.
        </p>
    </div>
</body>

</html>
