spring.application.name=siges-api
server.servlet.context-path=/api

spring.jpa.hibernate.ddl-auto=validate

security.jwt.refresh_expiration=86400000
security.jwt.access_expiration=604800000

login.max_attempts=3
login.lock_minutes=15

springdoc.show-actuator=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.recovery.mobile-redirect-url=myapp://reset-password
app.recovery.web-redirect-url=https://frontend.com/reset-password
app.recovery.token-expiration=PT15M