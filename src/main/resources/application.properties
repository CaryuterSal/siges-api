spring.application.name=siges-api
server.servlet.context-path=/api

spring.jpa.hibernate.ddl-auto=validate

security.jwt.refresh_expiration=604800000
security.jwt.access_expiration=2764800000

login.max_attempts=3
login.lock_minutes=15

springdoc.show-actuator=true

app.recovery.web-success-url=${PASSWORD_RECOVERY_WEB_SUCCESS_URL:https://frontend.com/reset-password}
app.recovery.web-used-url=${PASSWORD_RECOVERY_WEB_USED_URL:https://frontend.com/token-used}
app.recovery.web-expired-url=${PASSWORD_RECOVERY_WEB_EXPIRED_URL:https://frontend.com/token-expired}
app.recovery.mobile-success-url=${PASSWORD_RECOVERY_MOBILE_SUCCESS_URL:myapp://reset-password}
app.recovery.mobile-used-url=${PASSWORD_RECOVERY_MOBILE_USED_URL:myapp://token-used}
app.recovery.mobile-expired-url=${PASSWORD_RECOVERY_MOBILE_EXPIRED_URL:myapp://token-expired}
app.recovery.token-expiration=PT15M

management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health

management.health.group.readiness.incude: db, diskSpace

# AWS S3 Configuration
aws.s3.region=${AWS_REGION:us-east-1}
aws.s3.bucket-name=${AWS_S3_BUCKET:test-bucket}
aws.s3.cloudfront-domain=${AWS_CLOUDFRONT_DOMAIN:domain.com}

# Timezone Configuration (America/Mexico_City by default)
spring.jackson.time-zone=America/Mexico_City
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City