services:

  api:
    image: caryutersal/siges-api:main
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/siges
      SPRING_DATASOURCE_USERNAME: redis://redis:6379
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      SPRING_DATA_REDIS_URL: ${SPRING_DATA_REDIS_URL}
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET}

      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
    volumes:
      - /home/ubuntu/siges/secrets:/app/secrets:ro

  postgres:
    container_name: siges-postgres
    environment:
      POSTGRES_DB: siges
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    container_name: siges-redis
    command: redis-server --save "" --appendonly no