name: build and deploy spring-api

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21
          cache: gradle

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: us-east-1

      - name: Write Firebase credentials
        run: |
          echo "${{ secrets.FIREBASE_CREDENTIALS_ENCODED }}" | base64 -d > /tmp/firebase-credentials.json

      - name: run tests
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-credentials.json
        run: ./gradlew clean test
  deploy:
    needs: build
    if: github.ref_name == 'main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: us-east-1

      - name: login docker
        run: echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | docker login -u ${{ vars.DOCKER_HUB_USERNAME }} --password-stdin

      - name: build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKER_HUB_USERNAME }}/siges-api:main

      - name: zip artifacts
        run: zip -r deployment.zip appspec.yml scripts/

      - name: upload to S3
        run: |
          aws s3 cp deployment.zip \
            s3://${{ secrets.S3_BUCKET }}/deployment.zip

      - name: trigger CodeDeploy
        run: |
          aws deploy create-deployment \
            --application-name Siges-Api \
            --deployment-group-name siges-api-production \
            --s3-location bucket=${{ secrets.S3_BUCKET }},key=deployment.zip,bundleType=zip

      - name: wait for deployment
        run: |
          DEPLOYMENT_ID=$(aws deploy list-deployments \
            --application-name Siges-Api \
            --deployment-group-name siges-api-production \
            --query 'deployments[0]' \
            --output text)
          aws deploy wait deployment-successful \
            --deployment-id $DEPLOYMENT_ID

      - name: notify deploy
        if: always()
        run: |
          STATUS="${{ job.status }}"
          EMOJI=$([ "$STATUS" = "success" ] && echo "✅" || echo "❌")
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "from": "${{ secrets.DEPLOY_NOTIFICATION_FROM }}",
              "to": ["${{ secrets.DEPLOY_NOTIFICATION_TO }}"],
              "subject": "'"$EMOJI SIGES Deploy $STATUS"'",
              "html": "<p>Branch <strong>${{ github.ref_name }}</strong> — <strong>'"$STATUS"'</strong></p><p>Commit: ${{ github.sha }}</p><p>Por: ${{ github.actor }}</p>"
            }'
