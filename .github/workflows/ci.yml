name: build and deploy spring-api

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21
          cache: gradle

      - name: run tests
        run: ./gradlew clean test

  deploy:
    needs: build
    if: github.ref_name == 'main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: login docker
        run: echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | docker login -u ${{ vars.DOCKER_HUB_USERNAME }} --password-stdin

      - name: build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKER_HUB_USERNAME }}/siges-api:main

      - name: deploy on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/siges
            docker compose -f compose.yaml -f compose.prod.yaml pull
            docker compose -f compose.yaml -f compose.prod.yaml up -d
            docker image prune -f
      - name: notify deploy
        if: always()
        run: |
          STATUS="${{ job.status }}"
          COLOR=$([ "$STATUS" = "success" ] && echo "#22c55e" || echo "#ef4444")
          EMOJI=$([ "$STATUS" = "success" ] && echo "✅" || echo "❌")
          
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "from": "SIGES Deploy <siges.no.reply@siges.lat",
              "to": ["tu@correo.com"],
              "subject": "'"$EMOJI SIGES Deploy $STATUS"'",
              "html": "<p>El deploy del branch <strong>${{ github.ref_name }}</strong> terminó con estado <strong>'"$STATUS"'</strong>.</p><p>Commit: ${{ github.sha }}</p><p>Por: ${{ github.actor }}</p>"
            }'
